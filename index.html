<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F8E90">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orais RCA">
<title>Orais RCA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="https://app.orais.com.br/icon-192.png">
<link rel="apple-touch-icon" href="https://app.orais.com.br/apple-touch-icon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; border: 0; display: block;
           padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #FFFFFF; }
  #carregando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #4F8E90; }
</style>
</head>
<body>
<div id="carregando">Carregando Orais RCA…</div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxFdepvBbEWem8CKOAoQZ6-lykkHVmChfGy_2LXwu43fpL5UC9c1XXp1-IK7N2yfa9m/exec?rca=1" allow="clipboard-write; camera; microphone" title="Orais RCA"></iframe>
<script>
  document.getElementById('app').addEventListener('load', function () {
    var c = document.getElementById('carregando'); if (c) c.remove();
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
<script>
  // wa_pdf: o app (dentro do iframe) manda a mensagem + PDFs; o casco abre o compartilhamento nativo
  // (WhatsApp aparece na lista) com os arquivos em anexo. Sem suporte: baixa os PDFs e abre o WhatsApp com o texto.
  (function () {
    function b64ToFile(b64, nome, mime) {
      var bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
      for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
      return new File([u8], nome, { type: mime || 'application/pdf' });
    }
    function fechar() { var o = document.getElementById('orais-wa'); if (o) o.remove(); }
    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.tipo !== 'orais-wa' || !d.arquivos || !d.arquivos.length) return;
      window.__oraisWaUltimo = d;
      try { ev.source.postMessage({ tipo: 'orais-wa-ok' }, '*'); } catch (e) {}
      fechar();
      // arquivos vem em base64 (Drive) ou por URL (fotos do site, baixadas aqui direto do CDN)
      var pend = d.arquivos.map(function (a) {
        if (a.b64) { try { return Promise.resolve(b64ToFile(a.b64, a.nome, a.mime)); } catch (e1) { return Promise.resolve(null); } }
        return fetch(a.url).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.blob(); })
          .then(function (bl) { return new File([bl], a.nome || 'arquivo', { type: bl.type || a.mime || 'application/octet-stream' }); })
          .catch(function () { return null; });
      });
      Promise.all(pend).then(function (fs) { montar(fs.filter(function (x) { return !!x; })); });
    });
    function montar(files) {
      var d = window.__oraisWaUltimo || {};
      var podeAnexo = !!(files.length && navigator.share && navigator.canShare && navigator.canShare({ files: files }));
      if (!files.length) { window.open('https://wa.me/?text=' + encodeURIComponent(d.texto || ''), '_blank'); return; }
      var ov = document.createElement('div'); ov.id = 'orais-wa';
      ov.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;';
      var nomes = files.map(function (f) { return f.name; }).join('<br>');
      ov.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:380px;width:100%;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">' +
        '<div style="font-size:18px;font-weight:800;color:#2F5556;margin-bottom:6px;">' + (d.titulo || 'Enviar jogo') + '</div>' +
        '<div style="font-size:13px;color:#555;margin-bottom:16px;">' + (podeAnexo ? 'Em anexo:<br>' : 'Os arquivos vão ser baixados; anexe-os na conversa.<br>') + '<b>' + nomes + '</b></div>' +
        '<button id="orais-wa-ir" style="width:100%;min-height:52px;border:0;border-radius:999px;background:#25D366;color:#fff;font-size:17px;font-weight:800;cursor:pointer;">' + (podeAnexo ? '📲 Enviar pelo WhatsApp' : '📥 Baixar arquivos e abrir WhatsApp') + '</button>' +
        '<button id="orais-wa-x" style="width:100%;min-height:44px;margin-top:10px;border:1px solid #E9EEEE;border-radius:999px;background:#fff;color:#2F5556;font-size:15px;font-weight:700;cursor:pointer;">Cancelar</button></div>';
      document.body.appendChild(ov);
      document.getElementById('orais-wa-x').onclick = fechar;
      document.getElementById('orais-wa-ir').onclick = function () {
        if (podeAnexo) {
          navigator.share({ files: files, text: d.texto || '', title: d.titulo || '' }).then(fechar).catch(function (err) {
            if (err && err.name === 'AbortError') { fechar(); return; }
            // falhou de verdade: baixa e abre o texto
            baixarEAbrir();
          });
        } else baixarEAbrir();
      };
      function baixarEAbrir() {
        try {
          for (var i = 0; i < files.length; i++) {
            var a = document.createElement('a'); a.href = URL.createObjectURL(files[i]); a.download = files[i].name; document.body.appendChild(a); a.click();
            (function (el) { setTimeout(function () { el.remove(); }, 4000); })(a);
          }
        } catch (eD) {}
        window.open('https://wa.me/?text=' + encodeURIComponent(d.texto || ''), '_blank');
        fechar();
      }
    }
  })();
</script>
<script>
  // wa_lista: varios produtos em sequencia (um compartilhamento por produto: 1a foto com legenda + demais fotos)
  (function () {
    function fechar() { var o = document.getElementById('orais-wa'); if (o) o.remove(); }
    function baixarUrl(a) {
      if (a.b64) {   // videos_wa: arquivo que ja vem pronto (video do Drive)
        try { var bin = atob(a.b64), n = bin.length, u8 = new Uint8Array(n); while (n--) u8[n] = bin.charCodeAt(n); return Promise.resolve(new File([u8], a.nome || 'video.mp4', { type: a.mime || 'video/mp4' })); }
        catch (eB) { return Promise.resolve(null); }
      }
      return fetch(a.url).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.blob(); })
        .then(function (bl) { return new File([bl], a.nome || 'foto.jpg', { type: bl.type || a.mime || 'image/jpeg' }); }).catch(function () { return null; });
    }
    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.tipo !== 'orais-wa-lote' || !d.lotes || !d.lotes.length) return;
      var src = ev.source;
      try { src.postMessage({ tipo: 'orais-wa-ok' }, '*'); } catch (e) {}
      var i = 0, enviados = 0;
      function fim() { fechar(); try { src.postMessage({ tipo: 'orais-wa-lote-fim', enviados: enviados }, '*'); } catch (e) {} }
      // tela inicial: tudo de uma vez (1 compartilhamento, legenda com todos os produtos) ou um por um
      function escolha() {
        fechar();
        var totalF = 0; for (var q = 0; q < d.lotes.length; q++) totalF += d.lotes[q].arquivos.length;
        var ov = document.createElement('div'); ov.id = 'orais-wa';
        ov.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;';
        ov.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:380px;width:100%;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">' +
          '<div style="font-size:17px;font-weight:800;color:#2F5556;margin-bottom:4px;">' + d.lotes.length + ' produto(s) · ' + totalF + ' arquivo(s)</div>' +
          '<div id="orais-wa-st" style="font-size:13px;color:#555;margin-bottom:16px;">Baixando as fotos...</div>' +
          '<button id="orais-wa-tudo" disabled style="width:100%;min-height:52px;border:0;border-radius:999px;background:#25D366;color:#fff;font-size:16px;font-weight:800;cursor:pointer;opacity:.6;">📲 Enviar tudo de uma vez</button>' +
          '<div style="font-size:11px;color:#64748b;margin:6px 0 10px;">Todas as fotos juntas, com a descrição de todos os produtos na legenda</div>' +
          '<button id="orais-wa-umum" style="width:100%;min-height:46px;border:1px solid #CFE0E0;border-radius:999px;background:#E4EFEF;color:#2F5556;font-size:15px;font-weight:700;cursor:pointer;">Um produto por vez (legenda em cada)</button>' +
          '<button id="orais-wa-x" style="width:100%;min-height:40px;margin-top:6px;border:0;background:none;color:#64748b;font-size:14px;cursor:pointer;">Cancelar</button></div>';
        document.body.appendChild(ov);
        document.getElementById('orais-wa-x').onclick = fim;
        document.getElementById('orais-wa-umum').onclick = function () { i = 0; passo(); };
        // envio_unico: o botao principal SEMPRE manda todos os produtos num toque so (o navegador exige 1 toque por compartilhamento,
        // entao "um por vez" continua existindo so como opcao secundaria).
        var temVid = d.lotes.some(function (l) { return l.arquivos.some(function (a) { return !!a.b64 || /^video\//.test(a.mime || ''); }); });
        var bT0 = document.getElementById('orais-wa-tudo'), bU0 = document.getElementById('orais-wa-umum');
        bT0.textContent = '📲 Enviar os ' + d.lotes.length + ' produtos pelo WhatsApp';
        if (d.lotes.length === 1) bT0.textContent = '📲 Enviar pelo WhatsApp';
        var dica0 = bT0.nextElementSibling;
        if (dica0) dica0.textContent = temVid ? 'Tudo num envio só. O WhatsApp manda as fotos primeiro e os vídeos no final.' : 'Tudo num envio só, com a descrição de cada produto na legenda.';
        bU0.style.cssText = 'width:100%;min-height:40px;border:0;background:none;color:#2F5556;font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer;';
        bU0.textContent = temVid ? 'Prefiro um produto por vez (vídeo junto de cada)' : 'Prefiro um produto por vez';
        if (d.lotes.length === 1) bU0.style.display = 'none';
        var todos = [];
        d.lotes.forEach(function (l) { l.arquivos.forEach(function (a) { todos.push(a); }); });
        Promise.all(todos.map(baixarUrl)).then(function (fs) {
          var files = fs.filter(function (x) { return !!x; });
          var st = document.getElementById('orais-wa-st'), bt = document.getElementById('orais-wa-tudo'); if (!st || !bt) return;
          var pode = !!(files.length && navigator.share && navigator.canShare && navigator.canShare({ files: files }));
          var texto = d.lotes.map(function (l) { return l.texto || ''; }).join('\n\n');
          st.textContent = pode ? files.length + ' arquivo(s) prontos.' : 'Seu aparelho não compartilha fotos por aqui: elas serão baixadas e o WhatsApp abre com o texto.';
          bt.disabled = false; bt.style.opacity = '1';
          bt.onclick = function () {
            if (pode) {
              navigator.share({ files: files, text: texto, title: d.titulo || '' }).then(function () { enviados = d.lotes.length; fim(); })
                .catch(function (err) {   // lote_fallback: se o compartilhar falhar (ex.: computador), baixa os arquivos e abre o WhatsApp com o texto
                  if (err && err.name === 'AbortError') return;
                  for (var k = 0; k < files.length; k++) { var a = document.createElement('a'); a.href = URL.createObjectURL(files[k]); a.download = files[k].name; document.body.appendChild(a); a.click(); (function (el) { setTimeout(function () { el.remove(); }, 4000); })(a); }
                  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
                  enviados = d.lotes.length; fim();
                });
            } else {
              for (var k = 0; k < files.length; k++) { var a = document.createElement('a'); a.href = URL.createObjectURL(files[k]); a.download = files[k].name; document.body.appendChild(a); a.click(); (function (el) { setTimeout(function () { el.remove(); }, 4000); })(a); }
              window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
              enviados = d.lotes.length; fim();
            }
          };
        });
      }
      function passo() {
        if (i >= d.lotes.length) { fim(); return; }
        var lote = d.lotes[i];
        fechar();
        var ov = document.createElement('div'); ov.id = 'orais-wa';
        ov.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;';
        ov.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:380px;width:100%;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">' +
          '<div style="font-size:13px;font-weight:700;color:#4F8E90;margin-bottom:4px;">PRODUTO ' + (i + 1) + ' DE ' + d.lotes.length + '</div>' +
          '<div style="font-size:17px;font-weight:800;color:#2F5556;margin-bottom:6px;">' + (lote.titulo || '') + '</div>' +
          '<div id="orais-wa-st" style="font-size:13px;color:#555;margin-bottom:16px;">Baixando ' + lote.arquivos.length + ' foto(s)...</div>' +
          '<button id="orais-wa-ir" disabled style="width:100%;min-height:52px;border:0;border-radius:999px;background:#25D366;color:#fff;font-size:17px;font-weight:800;cursor:pointer;opacity:.6;">📲 Enviar pelo WhatsApp</button>' +
          '<button id="orais-wa-pular" style="width:100%;min-height:44px;margin-top:10px;border:1px solid #E9EEEE;border-radius:999px;background:#fff;color:#2F5556;font-size:15px;font-weight:700;cursor:pointer;">Pular este</button>' +
          '<button id="orais-wa-x" style="width:100%;min-height:40px;margin-top:6px;border:0;background:none;color:#64748b;font-size:14px;cursor:pointer;">Cancelar tudo</button></div>';
        document.body.appendChild(ov);
        document.getElementById('orais-wa-x').onclick = fim;
        document.getElementById('orais-wa-pular').onclick = function () { i++; passo(); };
        Promise.all(lote.arquivos.map(baixarUrl)).then(function (fs) {
          var files = fs.filter(function (x) { return !!x; });
          var st = document.getElementById('orais-wa-st'), bt = document.getElementById('orais-wa-ir'); if (!st || !bt) return;
          var pode = !!(files.length && navigator.share && navigator.canShare && navigator.canShare({ files: files }));
          st.innerHTML = pode ? files.length + ' foto(s) prontas. Escolha o WhatsApp e o contato.' : 'Seu aparelho não compartilha fotos por aqui: elas serão baixadas e o WhatsApp abre com o texto.';
          bt.disabled = false; bt.style.opacity = '1';
          bt.onclick = function () {
            if (pode) {
              navigator.share({ files: files, text: lote.texto || '', title: lote.titulo || '' }).then(function () { enviados++; i++; passo(); })
                .catch(function (err) {   // lote_fallback
                  if (err && err.name === 'AbortError') return;
                  for (var k = 0; k < files.length; k++) { var a = document.createElement('a'); a.href = URL.createObjectURL(files[k]); a.download = files[k].name; document.body.appendChild(a); a.click(); (function (el) { setTimeout(function () { el.remove(); }, 4000); })(a); }
                  window.open('https://wa.me/?text=' + encodeURIComponent(lote.texto || ''), '_blank');
                  enviados++; i++; passo();
                });
            } else {
              for (var k = 0; k < files.length; k++) { var a = document.createElement('a'); a.href = URL.createObjectURL(files[k]); a.download = files[k].name; document.body.appendChild(a); a.click(); (function (el) { setTimeout(function () { el.remove(); }, 4000); })(a); }
              window.open('https://wa.me/?text=' + encodeURIComponent(lote.texto || ''), '_blank');
              enviados++; i++; passo();
            }
          };
        });
      }
      escolha();
    });
  })();
</script>
</body>
</html>
